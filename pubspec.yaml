name: drivepulse
description: "DrivePulse — offline external drive manager for Android and iOS. No account, no cloud, no network."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  file_picker: ^13.3.0
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  cryptography: ^2.9.0
  intl: ^0.20.3
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
