name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$version"
          tag="v${version%%+*}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          apk="drivepulse-${tag}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivepulse-android
          path: ${{ steps.release.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_APK: ${{ steps.release.outputs.apk }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --target "$RELEASE_COMMIT" \
            --title "DrivePulse $RELEASE_TAG" \
            --generate-notes \
            --notes "Android APK for direct installation. This build uses debug signing and is intended for testing, not Play Store distribution."
